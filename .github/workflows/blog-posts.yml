name: Latest articles

# Keeps the "Recent articles" list in profile/README.md in sync with
# journeytocode.io, between the BLOG-POST-LIST markers.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update recent articles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://journeytocode.io/rss.xml"
          readme_path: profile/README.md
          template: "$newline- [$title]($url) — $description"
          description_max_length: 120
          max_post_count: 5
          commit_message: "docs: update recent articles"
